<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>About Subtle Sayak</title>
    <link rel="stylesheet" href="../CSS/aboutstyle.css?v=1.5" />
    <link rel="stylesheet" href="../CSS/userinformationstyle.css?v=2.0" />
    <link rel="stylesheet" href="../CSS/softwareskillsstyle.css?v=1.4" />
    <link rel="stylesheet" href="../CSS/recommendationsstyle.css?v=1.2" />
    <link rel="stylesheet" href="../CSS/productionsstyle.css?v=1.4" />
    <link rel="stylesheet" href="../CSS/viewcontrols.css?v=1.5" />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css"
    />
    <link rel="icon" href="../../Resources/favicon/pilfav.png" type="image/png"/>
  </head>
  <body>
    <div class="top-container">
      <!-- Placeholder div where user information will dynamically be added -->
      <div class="user-info-panel">
        <!-- User information will be injected here by JS -->
      </div>
      <div class="navigation-buttons">
        <a href="index.html" class="nav-button">Portfolio</a>
        <a href="photography.html" class="nav-button">Photography</a>
        <a href="articles.html" class="nav-button">Articles</a>
        <a href="about.html" class="nav-button">About</a>
      </div>
    </div>
    <div class="bottom-container">
      <div class="horizontal-container">
        <h1 class="panel-title">Summary</h1>
        <div class="summary-panel">
          <p><!-- Summary will be dynamically inserted here --></p>
        </div>
        <hr class="recommendations-separator" />
        <span class="recommendations-spacer">&nbsp; &nbsp; &nbsp;</span>
        <h1 class="panel-title recommendations-title">Recommendations</h1>
        <div class="recommendations-panel">
          <div class="recommendation-content">
            <!-- Recommendations get inserted here -->
            <div class="recommendation-dots" id="recommendation-dots"></div>
          </div>
        </div>
        <hr class="recommendations-separator" />
        <span class="recommendations-spacer">&nbsp; &nbsp; &nbsp;</span>
        <h1 class="panel-title">Software Knowledge</h1>
        <div class="skills-panel">
          <div class="software-tag-container">
            <!-- Software tags will be dynamically inserted here -->
          </div>

          &nbsp; &nbsp; &nbsp;
          <h1 class="panel-title">Skills</h1>
          <div class="software-tag-container">
            <!-- Skills tags will be dynamically inserted here -->
          </div>
        </div>
        <hr />
      </div>
    </div>

    <div class="productions-panel">
      <div class="productions-subpanels">
        <!-- About sections are inserted here -->
        <!-- Production cards will be added here -->
      </div>
    </div>
    <script src="../JS/summary.js?v=1.3"></script>
    <script src="../JS/skills.js?v=1.5"></script>
    <script src="../JS/userinformation.js?v=1.7"></script>
    <script src="../JS/recommendations.js?v=1.2"></script>
    <script src="../JS/productions.js?v=1.5"></script>
    <script src="../JS/viewcontrols.js?v=1.5"></script>
    <script>
      // JavaScript to add 'active' class to the current page's navigation button
      document.addEventListener("DOMContentLoaded", function () {
        const currentPath = window.location.pathname.split("/").pop();
        if (window.PortfolioControls) window.PortfolioControls.initViewControls({ showResize: false });
        const navButtons = document.querySelectorAll(".nav-button");
        navButtons.forEach((button) => {
          if (button.getAttribute("href") === currentPath) {
            button.classList.add("active");
          }
        });
      });
    </script>
  </body>
</html>
